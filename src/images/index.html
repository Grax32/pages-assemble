<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery - Grax32.com</title>
    <style>
      body {
        background: #f8f9fa;
        color: #222;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
        text-align: center;
      }
      .gallery-img {
        height: 20vh;
        border: 1px solid #333;
        margin: 1rem;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      }
      hr {
        margin: 2rem 0;
        border: none;
        border-top: 2px solid #bbb;
      }
    </style>
  </head>
  <body>
    <img src="david-walker-text.svg" alt="David Walker Text Logo" class="gallery-img" />
    <hr/>
    <img src="tagline.svg" alt="Site Tagline" class="gallery-img" />
  </body>
</html>
